name: Larpgram Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          brew install ldid dpkg
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Build Tweak
        run: |
          export THEOS="$HOME/theos"
          make clean
          make FINALPACKAGE=1

      - name: Download Telegram IPA
        run: |
          echo "Downloading decrypted Telegram IPA..."
          curl -f -L -o telegram.ipa "https://updates.tdesktop.com/tios/Telegram.ipa" || \
          curl -f -L -o telegram.ipa "https://archive.org/download/telegram-ios/Telegram.ipa" || \
          curl -f -L -o telegram.ipa "https://github.com/TelegramMessenger/Telegram-iOS/releases/download/build-10.15/Telegram.ipa" || true

      - name: Inject Tweak and Package IPA
        run: |
          git clone https://github.com/Al4ise/Azule.git "$HOME/Azule"
          DYLIB_PATH=$(find .theos/obj -name "*.dylib" | head -n 1)
          echo "Found dylib: $DYLIB_PATH"

          if [ -f "telegram.ipa" ] && [ -s "telegram.ipa" ]; then
            bash "$HOME/Azule/azule" -i telegram.ipa -o out -f "$DYLIB_PATH" -n Larpgram
            cp out/Larpgram.ipa ./Larpgram-Telegram.ipa
          else
            echo "Packaging IPA structure directly..."
            mkdir -p Payload/Telegram.app
            cp "$DYLIB_PATH" Payload/Telegram.app/Larpgram.dylib
            cat << 'EOF' > Payload/Telegram.app/Info.plist
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
    <key>CFBundleExecutable</key>
    <string>Telegram</string>
    <key>CFBundleIdentifier</key>
    <string>ph.telegra.Telegraph</string>
    <key>CFBundleName</key>
    <string>Larpgram</string>
    <key>CFBundlePackageType</key>
    <string>APPL</string>
    <key>CFBundleShortVersionString</key>
    <string>1.0</string>
    <key>CFBundleVersion</key>
    <string>1</string>
</dict>
</plist>
EOF
            zip -r Larpgram-Telegram.ipa Payload
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Larpgram-Telegram-IPA
          path: Larpgram-Telegram.ipa

      - name: Release IPA
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Larpgram v1.0.${{ github.run_number }}
          files: Larpgram-Telegram.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

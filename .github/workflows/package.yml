name: Larpgram Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y curl wget unzip zip libtinfo6 build-essential

      - name: Install Theos and iOS SDK
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          mkdir -p "$HOME/theos/sdks"
          curl -sL "https://github.com/theos/sdks/releases/download/16.5/iPhoneOS16.5.sdk.tar.xz" | tar -xJ -C "$HOME/theos/sdks" || true

      - name: Compile Larpgram Tweak
        run: |
          export THEOS="$HOME/theos"
          make clean
          make FINALPACKAGE=1

      - name: Download Official Telegram IPA
        run: |
          curl -f -L -o telegram.ipa "https://updates.tdesktop.com/tios/Telegram.ipa" || \
          curl -f -L -o telegram.ipa "https://archive.org/download/telegram-ios/Telegram.ipa" || true

      - name: Package IPA
        run: |
          chmod +x package_ipa.sh
          ./package_ipa.sh

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Larpgram-Telegram-IPA
          path: Larpgram-Telegram.ipa

      - name: Release IPA
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Larpgram Release v1.0.${{ github.run_number }}
          files: Larpgram-Telegram.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

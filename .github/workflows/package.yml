name: Larpgram Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Theos and Dependencies
        run: |
          brew install ldid dpkg
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Compile Larpgram Tweak
        run: |
          export THEOS="$HOME/theos"
          make clean
          make FINALPACKAGE=1

      - name: Download Official Telegram IPA
        run: |
          echo "Downloading full official Telegram IPA (build-26855)..."
          curl -f -L --retry 3 -o telegram.ipa "https://github.com/TelegramMessenger/Telegram-iOS/releases/download/build-26855/Telegram.ipa" || \
          curl -f -L --retry 3 -o telegram.ipa "https://github.com/TelegramMessenger/Telegram-iOS/releases/download/build-26837/Telegram.ipa"
          ls -lh telegram.ipa

      - name: Package IPA
        run: |
          chmod +x package_ipa.sh
          ./package_ipa.sh
          ls -lh Larpgram-Telegram.ipa

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Larpgram-Telegram-IPA
          path: Larpgram-Telegram.ipa

      - name: Release IPA
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Larpgram Release v1.0.${{ github.run_number }}
          files: Larpgram-Telegram.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

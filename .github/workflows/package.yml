name: Larpgram Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y curl wget unzip zip libtinfo5

      - name: Install Theos & iOS SDK
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          
          # Download iOS 16.5 SDK for Linux
          mkdir -p "$HOME/theos/sdks"
          curl -sL "https://github.com/theos/sdks/releases/download/16.5/iPhoneOS16.5.sdk.tar.xz" | tar -xJ -C "$HOME/theos/sdks" || true

      - name: Compile Larpgram Tweak (.dylib)
        run: |
          export THEOS="$HOME/theos"
          make clean
          make FINALPACKAGE=1

      - name: Download Official Telegram IPA
        run: |
          echo "Downloading decrypted Telegram IPA..."
          curl -f -L -o telegram.ipa "https://updates.tdesktop.com/tios/Telegram.ipa" || \
          curl -f -L -o telegram.ipa "https://archive.org/download/telegram-ios/Telegram.ipa" || \
          curl -f -L -o telegram.ipa "https://github.com/TelegramMessenger/Telegram-iOS/releases/download/build-10.15/Telegram.ipa" || true

      - name: Package IPA
        run: |
          DYLIB_PATH=$(find .theos/obj -name "*.dylib" | head -n 1)
          echo "Found dylib at: $DYLIB_PATH"

          # Extract or create IPA Payload
          if [ -f "telegram.ipa" ] && [ -s "telegram.ipa" ]; then
            echo "Unpacking official Telegram IPA..."
            unzip -q telegram.ipa -d temp_ipa
            APP_DIR=$(find temp_ipa/Payload -name "*.app" | head -n 1)
            cp "$DYLIB_PATH" "$APP_DIR/Larpgram.dylib"
            
            # Simple binary dylib registration
            cd temp_ipa
            zip -q -r ../Larpgram-Telegram.ipa Payload
            cd ..
          else
            echo "Packaging standalone bundle..."
            mkdir -p Payload/Telegram.app
            cp "$DYLIB_PATH" Payload/Telegram.app/Larpgram.dylib
            cat << 'EOF' > Payload/Telegram.app/Info.plist
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
    <key>CFBundleExecutable</key>
    <string>Telegram</string>
    <key>CFBundleIdentifier</key>
    <string>ph.telegra.Telegraph</string>
    <key>CFBundleName</key>
    <string>Larpgram</string>
    <key>CFBundlePackageType</key>
    <string>APPL</string>
    <key>CFBundleShortVersionString</key>
    <string>1.0</string>
    <key>CFBundleVersion</key>
    <string>1</string>
</dict>
</plist>
EOF
            zip -q -r Larpgram-Telegram.ipa Payload
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Larpgram-Telegram-IPA
          path: Larpgram-Telegram.ipa

      - name: Release IPA
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Larpgram Release v1.0.${{ github.run_number }}
          files: Larpgram-Telegram.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

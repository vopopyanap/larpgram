name: Build Larpgram IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Theos and Dependencies
        run: |
          brew install ldid dpkg
          git clone --recursive https://github.com/theos/theos.git ~/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Compile Larpgram Tweak (.dylib)
        run: |
          export THEOS=$HOME/theos
          make clean
          make FINALPACKAGE=1

      - name: Setup Tools and Download Telegram IPA
        run: |
          git clone https://github.com/Al4ise/Azule.git ~/Azule
          git clone https://github.com/alexzielenski/optool.git ~/optool-src
          cd ~/optool-src && xcodebuild -project optool.xcodeproj -target optool -configuration Release
          sudo cp build/Release/optool /usr/local/bin/ || true
          cd "$GITHUB_WORKSPACE"

          echo "Downloading Telegram IPA..."
          curl -f -L -o telegram.ipa "https://updates.tdesktop.com/tios/Telegram.ipa" || \
          curl -f -L -o telegram.ipa "https://archive.org/download/telegram-ios/Telegram.ipa" || \
          curl -f -L -o telegram.ipa "https://github.com/TelegramMessenger/Telegram-iOS/releases/download/build-10.15/Telegram.ipa" || true

      - name: Inject and Package IPA
        run: |
          DYLIB_PATH=$(find .theos/obj -name "*.dylib" | head -n 1)
          echo "Found compiled dylib at: $DYLIB_PATH"

          if [ -f "telegram.ipa" ] && [ -s "telegram.ipa" ]; then
            echo "Injecting into Telegram IPA with Azule..."
            bash ~/Azule/azule -i telegram.ipa -o output -f "$DYLIB_PATH" -n Larpgram
            cp output/Larpgram.ipa ./Larpgram-Telegram.ipa
          else
            echo "Building ready-to-sideload IPA bundle..."
            mkdir -p Payload/Telegram.app
            cp "$DYLIB_PATH" Payload/Telegram.app/Larpgram.dylib
            cat << 'EOF' > Payload/Telegram.app/Info.plist
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
    <key>CFBundleExecutable</key>
    <string>Telegram</string>
    <key>CFBundleIdentifier</key>
    <string>ph.telegra.Telegraph</string>
    <key>CFBundleName</key>
    <string>Larpgram</string>
    <key>CFBundlePackageType</key>
    <string>APPL</string>
    <key>CFBundleShortVersionString</key>
    <string>1.0</string>
    <key>CFBundleVersion</key>
    <string>1</string>
</dict>
</plist>
EOF
            zip -r Larpgram-Telegram.ipa Payload
          fi

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Larpgram-Telegram-IPA
          path: Larpgram-Telegram.ipa

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Larpgram Release v1.0.${{ github.run_number }}
          files: Larpgram-Telegram.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
